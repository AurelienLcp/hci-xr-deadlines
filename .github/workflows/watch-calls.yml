name: Watch conference calls

# Checks the official calls every day and opens an issue when a new call
# goes online or when a dates section changes. It never edits data.js.
on:
  schedule:
    - cron: "17 6 * * *"   # every day at 06:17 UTC
  workflow_dispatch:        # "Run workflow" button in the Actions tab

permissions:
  contents: read
  issues: write

concurrency:
  group: watch-calls
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Restore what was seen on the previous run (daily runs keep the cache alive).
      - name: Restore watcher state
        uses: actions/cache/restore@v4
        with:
          path: watch-state.json
          key: watch-state-${{ github.run_id }}
          restore-keys: watch-state-

      - name: Check calls
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/watch.py

      - name: Save watcher state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: watch-state.json
          key: watch-state-${{ github.run_id }}
